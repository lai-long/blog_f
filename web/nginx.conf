server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩文本类资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # API 反向代理到后端。两个容器在同一 docker 网络（blog-net），用容器名直连。
    # 关键：proxy_pass 直接写主机名会在 nginx 启动时一次性解析，后端不在/换 IP 都会挂；
    # 用变量 + docker 内置 DNS（127.0.0.11）改为请求时解析，后端随时重启都不怕
    location /v1/ {
        resolver 127.0.0.11 valid=5s;
        set $backend http://myblog-backend:8812;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 构建产物带内容哈希，永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history 模式兜底：所有前端路由都回退到 index.html
    location / {
        try_files $uri /index.html;
    }
}
